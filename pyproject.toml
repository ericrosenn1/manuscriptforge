[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "manuscriptforge"
version = "0.2.0"
description = "Evidence-grounded research workflows, source-only model evaluation, and reproducible manuscript tooling."
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [{ name = "Eric H. Rosenn" }]
keywords = ["writing-corpus", "document-processing", "scientific-writing", "reproducibility"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing",
]
dependencies = [
  "bibtexparser>=1.4,<2",
  "jinja2>=3.1",
  "openpyxl>=3.1",
  "numpy>=1.24,<3",
  "pandas>=2.0",
  "pydantic>=2.6",
  "psutil>=6.1,<8",
  "pypdf>=4.0",
  "python-docx>=1.1",
  "pyyaml>=6.0",
  "rich>=13.7",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8.0",
  "pytest-cov>=7.0,<8",
  "coverage>=7.10.3,<8",
  "ruff>=0.5",
  "build>=1.2",
  "cffconvert>=2.0",
]
docs = ["mkdocs>=1.6"]
openai = ["openai>=2.0,<4"]
ui = ["streamlit>=1.35"]

[project.urls]
Repository = "https://github.com/ericrosenn1/manuscriptforge"
Issues = "https://github.com/ericrosenn1/manuscriptforge/issues"

[project.scripts]
manuscriptforge = "manuscriptforge.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["manuscriptforge"]

[tool.hatch.build.targets.sdist]
include = ["/manuscriptforge", "/tests", "/examples", "/docs", "/scripts", "/.github", "/pyproject.toml", "/README.md", "/CHANGELOG.md", "/CITATION.cff", "/.gitignore", "/.gitattributes", "/.env.example"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.coverage.run]
source = ["manuscriptforge"]
relative_files = true
patch = ["subprocess"]
