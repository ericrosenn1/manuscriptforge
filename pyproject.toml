[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "manuscriptforge"
version = "0.1.0"
description = "Local writing-corpus analysis, curated style profiles, and traceable manuscript workflows."
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [{ name = "Eric H. Rosenn" }]
dependencies = [
  "bibtexparser>=1.4",
  "jinja2>=3.1",
  "openpyxl>=3.1",
  "pandas>=2.0",
  "pydantic>=2.6",
  "pypdf>=4.0",
  "python-docx>=1.1",
  "pyyaml>=6.0",
  "rich>=13.7",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8.0",
  "ruff>=0.5",
  "build>=1.2",
]
openai = ["openai>=1.40"]
ui = ["streamlit>=1.35"]

[project.scripts]
manuscriptforge = "manuscriptforge.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["manuscriptforge"]

[tool.hatch.build.targets.sdist]
include = ["/manuscriptforge", "/tests", "/examples", "/docs", "/scripts", "/.github", "/pyproject.toml", "/README.md", "/.gitignore", "/.gitattributes"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
