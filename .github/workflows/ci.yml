name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install ".[dev]"
      - run: python -m pytest -ra
      - run: python -m ruff check .
      - run: python -m mypy manuscriptforge
      - run: python -m build
      - run: python scripts/check_installed.py dist/manuscriptforge-0.1.0-py3-none-any.whl
      - run: python scripts/check_installed.py dist/manuscriptforge-0.1.0.tar.gz
